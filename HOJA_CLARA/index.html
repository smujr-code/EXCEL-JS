<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HojaClara</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>
    Enunciado de Práctica de Curso 
    <span style="color:blue;">></span> 
    "HojaClara"
    </h1>
  
   <!-- Barra de herramientas superior con formato de celda incluida-->
     <div class="barra-superior">
        <span style="background-color: orange;" id="celda-activa-label">A1</span>
        <input style="background-color: #ffe5cc; border: 2px solid #f39c12;" type="text" id="barra-formulas" placeholder="Escribe valor o fórmula..." />
        <select id="formato">
            <option value="normal">Normal</option>
            <option value="moneda">Moneda</option>
            <option value="porcentaje">Porcentaje</option>
            <option value="decimal">Decimal</option>
        </select>
    </div>

    
    <div class="hoja-container" id="grid-container"></div> 
    
    <div class="acciones-inferiores">
        <button class="button-naranja" onclick="guardarEstadoLocal()">Guardar</button>
        <button class="button-naranja" onclick="cargarEstadoLocal()">Cargar</button>
        <button class="button-naranja" onclick="exportarACSV()">Exportar</button>
        <button class="button-naranja" onclick="limpiarTodaLaHoja()">Limpiar</button>
    </div>

    <script src="estado.js"></script> 
    <script src="evaluador.js"></script> 
    <script src="referencias.js"></script>
    <script src="funciones.js"></script>
    <script src="persistencia.js"></script>
    <script src="experiencia.js"></script>
    <script src="cuadricula.js"></script>
</body>
</html>
