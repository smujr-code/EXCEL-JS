<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HojaClara - Nivel 2</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: #fcfcfc;
            color: #13384c;
        }

        .header-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .header-subtitle {
            font-family: "Georgia", "Times New Roman", serif;
            font-style: italic;
            font-size: 24px;
            color: #2c6b6f;
            margin: 0;
            font-weight: normal;
        }

        .header-title {
            font-family: "Georgia", "Times New Roman", serif;
            font-size: 36px;
            color: #13384c;
            margin: 5px 0 15px 0;
            font-weight: bold;
        }

        .excel-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border: 2px solid #13384c;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 6px 12px rgba(19, 56, 76, 0.1);
        }

        table {
            border-collapse: collapse;
            width: 100%;
            table-layout: fixed;
        }

        th, td {
            border: 1px solid #dcdcdc;
            padding: 0;
            height: 28px;
            text-align: center;
            font-size: 13px;
            position: relative;
        }

        th {
            background-color: #f1f4f5;
            color: #2c6b6f;
            font-weight: 600;
        }

        td.row-header {
            background-color: #f1f4f5;
            color: #2c6b6f;
            font-weight: 600;
            width: 45px;
            text-align: center;
        }

        /* Estilo para celda activa/seleccionada en Nivel 2 */
        td.active-cell {
            outline: 2px solid #2c6b6f;
            z-index: 5;
            background-color: #f7fafc;
        }

        td span {
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            inset: 0;
            padding: 0 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <p class="header-subtitle">Enunciado de Práctica de Curso</p>
        <h1 class="header-title">“HojaClara”</h1>
    </div>

    <div class="excel-container">
        <table>
            <thead id="spreadsheet-head"></thead>
            <tbody id="spreadsheet-body"></tbody>
        </table>
    </div>

    <script>
        const TOTAL_ROWS = 15;
        const TOTAL_COLS = 10;

        const tableHead = document.getElementById('spreadsheet-head');
        const tableBody = document.getElementById('spreadsheet-body');

        // Nivel 2: Estructura de datos independiente (Matriz bidimensional de almacenamiento)
        let cellData = Array.from({ length: TOTAL_COLS }, () => 
            Array.from({ length: TOTAL_ROWS }, () => '')
        );

        // Control de celda activa seleccionada
        let activeCol = 0;
        let activeRow = 0;

        function getColumnLetter(index) {
            return String.fromCharCode(65 + index);
        }

        // Renderizado dinámico de la cuadrícula reflejando el estado de los datos
        function renderGrid() {
            // 1. Cabecera superior (Letras de columnas)
            let headHtml = '<tr><th></th>';
            for (let c = 0; c < TOTAL_COLS; c++) {
                headHtml += `<th>${getColumnLetter(c)}</th>`;
            }
            headHtml += '</tr>';
            tableHead.innerHTML = headHtml;

            // 2. Cuerpo de la tabla (Filas, numeración y valores de la estructura de datos)
            let bodyHtml = '';
            for (let r = 0; r < TOTAL_ROWS; r++) {
                bodyHtml += '<tr>';
                bodyHtml += `<td class="row-header">${r + 1}</td>`;
                
                for (let c = 0; c < TOTAL_COLS; c++) {
                    const value = cellData[c][r];
                    const isActive = (activeCol === c && activeRow === r) ? 'active-cell' : '';
                    
                    bodyHtml += `<td data-col="${c}" data-row="${r}" class="${isActive}">
                        <span>${value}</span>
                    </td>`;
                }
                bodyHtml += '</tr>';
            }
            tableBody.innerHTML = bodyHtml;
        }

        // Nivel 2: Edición de celdas al hacer clic o doble clic (activando un campo de entrada)
        tableBody.addEventListener('click', (event) => {
            const td = event.target.closest('td');
            if (!td || td.classList.contains('row-header')) return;

            const c = parseInt(td.dataset.col, 10);
            const r = parseInt(td.dataset.row, 10);

            activeCol = c;
            activeRow = r;
            renderGrid();
        });

        tableBody.addEventListener('dblclick', (event) => {
            const td = event.target.closest('td');
            if (!td || td.classList.contains('row-header')) return;

            const c = parseInt(td.dataset.col, 10);
            const r = parseInt(td.dataset.row, 10);

            activeCol = c;
            activeRow = r;

            // Campo de edición (Prompt simple para confirmar valor y guardarlo en la estructura)
            const currentValue = cellData[c][r];
            const newValue = prompt(`Editar celda ${getColumnLetter(c)}${r + 1}:`, currentValue);

            if (newValue !== null) {
                cellData[c][r] = newValue; // Guardar en la estructura de datos independiente
                renderGrid(); // Reflejar en la cuadrícula visual
            }
        });

        // Renderizado inicial
        renderGrid();
    </script>
</body>
</html>
